# ZephyrOS Hardened — blacklist legacy/risky kernel modules.
#
# These have a history of CVEs, DMA-attack vectors, or are obsolete and rarely
# needed. Remove an `install ... /bin/false` line if you legitimately need the
# module (e.g. you actually use Firewire audio).

# --- Legacy filesystems with poor security track records ---
install cramfs   /bin/false
install freevxfs /bin/false
install jffs2    /bin/false
install hfs      /bin/false
install hfsplus  /bin/false
install squashfs /bin/false
install udf      /bin/false

# --- Network protocols rarely needed on a modern desktop ---
install dccp     /bin/false
install sctp     /bin/false
install rds      /bin/false
install tipc     /bin/false

# --- DMA-attack surfaces (FireWire, Thunderbolt-as-PCIe) ---
install firewire-core /bin/false
install firewire-ohci /bin/false
install firewire-sbp2 /bin/false
install thunderbolt   /bin/false

# --- Wireless protocols that are easy to MITM ---
install bluetooth     /bin/false
install btusb         /bin/false
# (override the above if you need BT; Hardened defaults to off)
