#!/usr/bin/nft -f
#
# ZephyrOS default firewall.
#
# Posture: default-deny inbound, allow all outbound. This is a sane baseline
# for a desktop/laptop — nothing listens to the network unless you explicitly
# open a port below. Loaded by nftables.service at boot.
#
# To open a port, uncomment the relevant line (or add your own) and reload:
#   sudo systemctl reload nftables
#
# Inspect the live ruleset with:
#   sudo nft list ruleset

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        # Established/related traffic and loopback are always allowed.
        ct state established,related accept
        ct state invalid drop
        iif "lo" accept

        # ICMP / ICMPv6 — needed for path-MTU discovery and basic reachability.
        ip protocol icmp accept
        ip6 nexthdr ipv6-icmp accept

        # --- Optional services (closed by default) ---
        # tcp dport 22 accept          # SSH
        # tcp dport { 80, 443 } accept # web server
        # udp dport 5353 accept        # mDNS / Avahi local discovery
        # udp dport 51820 accept       # WireGuard

        # Everything else is dropped by the chain policy above.
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
